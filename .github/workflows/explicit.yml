{
  "name": "Merge group explicit.yml",
  "on": {
    "merge_group": {
      "types": [
        "checks_requested"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "name": "Probe explicit",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 8,
      "outputs": {
        "evidence": "${{ steps.probe.outputs.evidence }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "id": "probe",
          "name": "Execute immutable source probe",
          "run": "node probe.cjs",
          "env": {
            "CTX_SHA": "${{ github.sha }}",
            "CTX_REF": "${{ github.ref }}",
            "CTX_WORKFLOW_SHA": "${{ github.workflow_sha }}",
            "CTX_WORKFLOW_REF": "${{ github.workflow_ref }}",
            "WORKFLOW_MARKER": "explicit.yml:second-pr-v2"
          }
        }
      ]
    }
  }
}
