{
  "name": "Merge group ci.yml",
  "on": {
    "merge_group": null,
    "pull_request": {
      "types": [
        "opened"
      ],
      "branches": [
        "queue-target"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "name": "Queue gate",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 8,
      "outputs": {
        "evidence": "${{ steps.probe.outputs.evidence }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "id": "probe",
          "name": "Execute immutable source probe",
          "run": "node probe.cjs",
          "env": {
            "CTX_SHA": "${{ github.sha }}",
            "CTX_REF": "${{ github.ref }}",
            "CTX_WORKFLOW_SHA": "${{ github.workflow_sha }}",
            "CTX_WORKFLOW_REF": "${{ github.workflow_ref }}",
            "WORKFLOW_MARKER": "ci.yml:second-pr-v2"
          }
        },
        {
          "name": "Real queue failure gate",
          "run": "node gate.cjs"
        }
      ]
    }
  }
}
