{
  "name": "Merge group not-ignored.yml",
  "on": {
    "merge_group": {
      "branches-ignore": [
        "main",
        "other-*"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "name": "Probe not-ignored",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 8,
      "outputs": {
        "evidence": "${{ steps.probe.outputs.evidence }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "id": "probe",
          "name": "Execute immutable source probe",
          "run": "node probe.cjs",
          "env": {
            "CTX_SHA": "${{ github.sha }}",
            "CTX_REF": "${{ github.ref }}",
            "CTX_WORKFLOW_SHA": "${{ github.workflow_sha }}",
            "CTX_WORKFLOW_REF": "${{ github.workflow_ref }}",
            "WORKFLOW_MARKER": "not-ignored.yml:corrected-v3"
          }
        }
      ]
    }
  }
}
